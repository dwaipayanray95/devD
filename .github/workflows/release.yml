name: Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go with Cache
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: go.sum

      - name: Cache Go Build Artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-cache-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-cache-

      - name: Build Cross-Platform Binaries
        run: |
          mkdir -p dist
          LDFLAGS="-s -w"
          
          # Build macOS Intel
          GOOS=darwin GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/devd-darwin-amd64 main.go &
          
          # Build macOS Apple Silicon (ARM)
          GOOS=darwin GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/devd-darwin-arm64 main.go &
          
          # Build Linux Intel
          GOOS=linux GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/devd-linux-amd64 main.go &
          
          # Build Linux ARM
          GOOS=linux GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/devd-linux-arm64 main.go &
          
          # Build Windows Intel
          GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/devd-windows-amd64.exe main.go &
          
          wait

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/devd-darwin-amd64
            dist/devd-darwin-arm64
            dist/devd-linux-amd64
            dist/devd-linux-arm64
            dist/devd-windows-amd64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
